<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f9399"><title>Sem internet • ClassiQuiz</title>
<link rel="icon" type="image/svg+xml" href="assets/offline-sad.svg"><link rel="manifest" href="manifest.webmanifest">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#e6e6e6;color:#252a32;font:16px system-ui,-apple-system,Arial,sans-serif}body{display:grid;place-items:center;min-height:100dvh;padding:14px}.offline-box{width:min(100%,780px);border:3px outset #fff;box-shadow:5px 5px #777;background:#f4f4f4;padding:clamp(16px,5vw,36px);text-align:center}.offline-pics{display:flex;align-items:center;justify-content:center;gap:20px}.offline-globe{width:98px;height:98px;fill:none;stroke:#5f656c;stroke-width:4}.sad-button{border:2px solid transparent;background:transparent;padding:2px;cursor:pointer}.sad-button img{width:116px;height:116px;image-rendering:pixelated;filter:grayscale(1)}.sad-button:focus-visible{border-color:#626d85}h1{font-size:clamp(20px,5vw,30px);margin:18px 0 8px}p{line-height:1.5;color:#565b63;margin:8px auto 16px;max-width:470px}.offline-btn{padding:10px 18px;background:#d5d5d5;color:#23272c;border:3px outset #fff;font-weight:700;font-size:14px;min-height:42px;cursor:pointer}.offline-btn:active{border-style:inset}#offline-status{min-height:18px;font-size:12px}.runner-host{margin-top:15px;height:min(68dvh,520px);min-height:260px}.offline-box:has(.rn)>.offline-pics,.offline-box:has(.rn)>h1,.offline-box:has(.rn)>p,.offline-box:has(.rn)>.offline-btn{display:none}.offline-box:has(.rn){padding:clamp(8px,2vw,18px)}@media(max-width:480px){.offline-pics{gap:8px}.sad-button img{width:84px;height:84px}.offline-globe{width:75px;height:75px}.offline-box{padding:14px}}</style>
</head><body><main class="offline-box"><div class="offline-pics" aria-label="Conexão perdida">
<svg class="offline-globe" viewBox="0 0 100 100" aria-label="Globo sem internet" role="img"><circle cx="50" cy="50" r="40"/><ellipse cx="50" cy="50" rx="17" ry="40"/><path d="M10 50H90M19 27H81M19 73H81"/><path stroke="#f4f4f4" stroke-width="10" d="M14 85L86 15"/><path stroke="#575d66" stroke-width="5" d="M14 85L86 15"/></svg>
<button id="sad" class="sad-button" title="ClassiQuiz indisponível" aria-label="Ícone triste do ClassiQuiz"><img src="assets/offline-sad.svg" alt="Rostinho triste do ClassiQuiz"></button></div>
<h1>Sem conexão com a internet</h1><p>Não foi possível terminar de instalar os arquivos do ClassiQuiz neste aparelho. Ligue o Wi-Fi ou os dados móveis uma vez para concluir a instalação; depois disso o jogo funciona sem internet.</p>
<button class="offline-btn" id="retry">Tentar novamente</button><p id="offline-status" aria-live="polite"></p><div class="runner-host" id="offline-runner"></div></main>
<script src="assets/js/offline-runner.js"></script><script>
(()=>{'use strict';const R=window.CQ_RUNNER;R.earn('offlineSeen');let current=null;
document.getElementById('sad').addEventListener('click',()=>{if(current)return;R.earn('runnerSecret');current=R.startGame(document.getElementById('offline-runner'),{onExit:()=>{current=null;}});});
async function retry(){const s=document.getElementById('offline-status');s.textContent='Verificando conexão…';try{const ctrl=new AbortController();const id=setTimeout(()=>ctrl.abort(),6000);const r=await fetch('./index.html?online-check='+Date.now(),{cache:'no-store',signal:ctrl.signal});clearTimeout(id);if(!r.ok)throw Error('offline');location.replace('./index.html');}catch{s.textContent='Ainda sem conexão. Ligue a internet e tente novamente.';}}
document.getElementById('retry').addEventListener('click',retry);
window.addEventListener('online',()=>{const s=document.getElementById('offline-status');s.textContent=current?'A conexão voltou! Termine a partida ou toque em Tentar novamente.':'Conexão detectada. Voltando ao ClassiQuiz…';if(!current)retry();});
})();</script></body></html>
